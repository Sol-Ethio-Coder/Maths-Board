<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A4A">
<meta name="description" content="Math Board: a simple whiteboard for recording math lessons. Draw on your phone or PC.">
<title>Math Board</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="author" content="Sol Ethio Coder">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Math Board">
<meta property="og:description" content="A whiteboard for recording math lessons. Draw on your phone, record on your PC. Developer: Sol Ethio Coder.">
<meta property="og:image" content="/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="hint">Turn your phone sideways for a bigger board.</div>
<div id="stage"><div id="board" class="g"><canvas id="ink"></canvas></div></div>
<div id="tp" hidden><input id="ti" type="text" maxlength="200" placeholder="Type, e.g. x^2 + 3x = 0" autocomplete="off"><div id="sym"></div><div class="tb"><button id="tok" type="button">Place on board</button><button id="tcn" type="button">Cancel</button></div></div>
<div id="bar" role="toolbar" aria-label="Whiteboard tools"></div>
<button id="show" title="Show toolbar (H)">Menu</button>
<noscript>Math Board needs JavaScript to work.</noscript>
<script src="/vendor/mqtt.min.js"></script>
<script src="/js/sync.js"></script>
<script src="/js/app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})</script>
</body>
</html>
